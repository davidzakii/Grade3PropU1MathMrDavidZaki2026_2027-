<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <title>
      الوحدة الأولى - الأعداد النسبية والقوى والمعادلات الأسية | أ. ديفيد زكي
    </title>
    <style>
      /* ===== Reset & Base ===== */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
      }
      body {
        font-family: "Segoe UI", "Tahoma", "Cairo", "Arial", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.7;
        min-height: 100vh;
        transition:
          background 0.3s,
          color 0.3s;
        overflow-x: hidden;
      }
      :root {
        --bg: #f5f7fb;
        --bg-card: #ffffff;
        --bg-soft: #eef2f8;
        --bg-hover: #e3eaf5;
        --text: #1a2b4a;
        --text-soft: #4a5b7a;
        --text-mute: #7a8aa8;
        --primary: #2563eb;
        --primary-dark: #1e40af;
        --primary-soft: #dbeafe;
        --success: #16a34a;
        --success-soft: #dcfce7;
        --warning: #f59e0b;
        --warning-soft: #fef3c7;
        --danger: #dc2626;
        --danger-soft: #fee2e2;
        --gold: #eab308;
        --silver: #94a3b8;
        --bronze: #b45309;
        --border: #dbe3ef;
        --shadow: 0 2px 8px rgba(15, 30, 80, 0.06);
        --shadow-lg: 0 8px 24px rgba(15, 30, 80, 0.12);
        --radius: 14px;
        --radius-sm: 8px;
        --radius-lg: 20px;
        --grad-1: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
        --grad-2: linear-gradient(135deg, #16a34a 0%, #22d3ee 100%);
        --grad-3: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
      }
      [data-theme="dark"] {
        --bg: #0f172a;
        --bg-card: #1e293b;
        --bg-soft: #273449;
        --bg-hover: #334155;
        --text: #e2e8f0;
        --text-soft: #cbd5e1;
        --text-mute: #94a3b8;
        --primary: #60a5fa;
        --primary-dark: #3b82f6;
        --primary-soft: #1e3a8a;
        --success: #4ade80;
        --success-soft: #14532d;
        --warning: #fbbf24;
        --warning-soft: #78350f;
        --danger: #f87171;
        --danger-soft: #7f1d1d;
        --border: #334155;
        --shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.5);
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
      }
      input,
      select,
      textarea {
        font-family: inherit;
        font-size: inherit;
      }
      a {
        color: var(--primary);
        text-decoration: none;
      }
      img {
        max-width: 100%;
        display: block;
      }

      /* ===== Layout ===== */
      .app-shell {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 260px;
        background: var(--bg-card);
        border-left: 1px solid var(--border);
        padding: 20px 14px;
        position: fixed;
        top: 0;
        right: 0;
        height: 100vh;
        overflow-y: auto;
        z-index: 50;
        transition: transform 0.3s;
      }
      .sidebar::-webkit-scrollbar {
        width: 6px;
      }
      .sidebar::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 6px 18px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 14px;
      }
      .brand-logo {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: var(--grad-1);
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 18px;
        flex-shrink: 0;
      }
      .brand-info h1 {
        font-size: 15px;
        color: var(--text);
        font-weight: 700;
        line-height: 1.2;
      }
      .brand-info p {
        font-size: 11px;
        color: var(--text-mute);
        margin-top: 2px;
      }
      .nav-section {
        margin-bottom: 18px;
      }
      .nav-title {
        font-size: 11px;
        font-weight: 700;
        color: var(--text-mute);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 0 8px;
        margin-bottom: 8px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 10px;
        color: var(--text-soft);
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 2px;
        cursor: pointer;
        transition: all 0.2s;
        width: 100%;
        text-align: right;
      }
      .nav-item:hover {
        background: var(--bg-soft);
        color: var(--text);
      }
      .nav-item.active {
        background: var(--primary-soft);
        color: var(--primary);
        font-weight: 700;
      }
      .nav-item .icon {
        font-size: 18px;
        width: 22px;
        text-align: center;
      }
      .nav-item.locked {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .nav-item.locked::after {
        content: "🔒";
        margin-right: auto;
        font-size: 12px;
      }
      .nav-item.completed::after {
        content: "✓";
        margin-right: auto;
        color: var(--success);
        font-weight: 800;
      }

      .main {
        margin-right: 260px;
        flex: 1;
        min-width: 0;
        padding: 24px 28px;
        max-width: 1400px;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 22px;
        gap: 16px;
        flex-wrap: wrap;
      }
      .topbar-info h2 {
        font-size: 13px;
        color: var(--text-mute);
        font-weight: 500;
        margin-bottom: 4px;
      }
      .topbar-info h3 {
        font-size: 22px;
        color: var(--text);
        font-weight: 800;
      }
      .topbar-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: var(--bg-soft);
        display: grid;
        place-items: center;
        font-size: 18px;
        color: var(--text-soft);
        transition: all 0.2s;
      }
      .icon-btn:hover {
        background: var(--bg-hover);
        color: var(--text);
        transform: translateY(-2px);
      }

      .page {
        display: none;
        animation: fadeIn 0.35s;
      }
      .page.active {
        display: block;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ===== Cards & Components ===== */
      .card {
        background: var(--bg-card);
        border-radius: var(--radius);
        padding: 20px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
      }
      .card-lg {
        padding: 28px;
      }
      .grid {
        display: grid;
        gap: 18px;
      }
      .grid-2 {
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }
      .grid-3 {
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
      .grid-4 {
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      }
      .btn {
        padding: 10px 20px;
        font-weight: 600;
        border-radius: 10px;
        font-size: 14px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s;
        border: 2px solid transparent;
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--primary-dark);
        transform: translateY(-2px);
        box-shadow: var(--shadow-lg);
      }
      .btn-success {
        background: var(--success);
        color: #fff;
      }
      .btn-success:hover {
        filter: brightness(0.9);
        transform: translateY(-2px);
      }
      .btn-warning {
        background: var(--warning);
        color: #fff;
      }
      .btn-danger {
        background: var(--danger);
        color: #fff;
      }
      .btn-ghost {
        background: var(--bg-soft);
        color: var(--text);
      }
      .btn-ghost:hover {
        background: var(--bg-hover);
      }
      .btn-outline {
        background: transparent;
        border-color: var(--primary);
        color: var(--primary);
      }
      .btn-outline:hover {
        background: var(--primary-soft);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }
      .btn-lg {
        padding: 14px 28px;
        font-size: 16px;
      }
      .btn-sm {
        padding: 6px 12px;
        font-size: 12px;
      }
      .btn-block {
        width: 100%;
        justify-content: center;
      }

      /* ===== Hero / Welcome ===== */
      .hero {
        background: var(--grad-1);
        color: #fff;
        border-radius: var(--radius-lg);
        padding: 32px;
        position: relative;
        overflow: hidden;
        margin-bottom: 20px;
      }
      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 80% 20%,
          rgba(255, 255, 255, 0.18),
          transparent 50%
        );
      }
      .hero-inner {
        position: relative;
        z-index: 1;
      }
      .hero h2 {
        font-size: 28px;
        font-weight: 800;
        margin-bottom: 8px;
      }
      .hero p {
        font-size: 16px;
        opacity: 0.95;
        margin-bottom: 18px;
        max-width: 600px;
      }
      .hero .teacher {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.18);
        padding: 8px 16px;
        border-radius: 999px;
        font-weight: 600;
        backdrop-filter: blur(8px);
      }
      .hero-actions {
        margin-top: 18px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .hero-actions .btn {
        background: rgba(255, 255, 255, 0.95);
        color: var(--primary);
      }
      .hero-actions .btn:hover {
        background: #fff;
      }

      .stat-card {
        background: var(--bg-card);
        border-radius: var(--radius);
        padding: 18px;
        border: 1px solid var(--border);
        position: relative;
        overflow: hidden;
      }
      .stat-card .stat-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 22px;
        margin-bottom: 12px;
      }
      .stat-card .stat-value {
        font-size: 28px;
        font-weight: 800;
        color: var(--text);
        margin-bottom: 4px;
      }
      .stat-card .stat-label {
        font-size: 13px;
        color: var(--text-mute);
        font-weight: 500;
      }
      .stat-card.primary .stat-icon {
        background: var(--primary-soft);
        color: var(--primary);
      }
      .stat-card.success .stat-icon {
        background: var(--success-soft);
        color: var(--success);
      }
      .stat-card.warning .stat-icon {
        background: var(--warning-soft);
        color: var(--warning);
      }
      .stat-card.danger .stat-icon {
        background: var(--danger-soft);
        color: var(--danger);
      }

      /* ===== Progress ===== */
      .progress {
        height: 10px;
        background: var(--bg-soft);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .progress-bar {
        height: 100%;
        background: var(--grad-1);
        border-radius: 999px;
        transition: width 0.6s;
        position: relative;
        overflow: hidden;
      }
      .progress-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.3),
          transparent
        );
        animation: shimmer 2.5s infinite;
      }
      @keyframes shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }
      .progress-thin {
        height: 6px;
      }

      /* ===== Lesson Roadmap ===== */
      .roadmap {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-top: 18px;
      }
      .roadmap-step {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 18px;
        background: var(--bg-card);
        border: 2px solid var(--border);
        border-radius: var(--radius);
        cursor: pointer;
        transition: all 0.25s;
        position: relative;
      }
      .roadmap-step:hover {
        transform: translateX(-4px);
        border-color: var(--primary);
      }
      .roadmap-step.completed {
        border-color: var(--success);
        background: var(--success-soft);
      }
      .roadmap-step.locked {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .roadmap-step.locked:hover {
        transform: none;
      }
      .roadmap-step.current {
        border-color: var(--primary);
        background: var(--primary-soft);
        box-shadow: var(--shadow-lg);
      }
      .roadmap-num {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: var(--bg-soft);
        color: var(--text-soft);
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 16px;
        flex-shrink: 0;
      }
      .roadmap-step.completed .roadmap-num {
        background: var(--success);
        color: #fff;
      }
      .roadmap-step.current .roadmap-num {
        background: var(--primary);
        color: #fff;
      }
      .roadmap-info {
        flex: 1;
        min-width: 0;
      }
      .roadmap-info h4 {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 2px;
      }
      .roadmap-info p {
        font-size: 12px;
        color: var(--text-mute);
      }
      .roadmap-arrow {
        color: var(--text-mute);
        font-size: 20px;
      }
      .roadmap-step.completed + .roadmap-step::before {
        content: "";
        position: absolute;
        top: -14px;
        right: 42px;
        width: 2px;
        height: 14px;
        background: var(--success);
      }

      /* ===== Lesson Tabs ===== */
      .lesson-tabs {
        display: flex;
        gap: 6px;
        border-bottom: 2px solid var(--border);
        margin-bottom: 24px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .lesson-tabs::-webkit-scrollbar {
        display: none;
      }
      .lesson-tab {
        padding: 12px 18px;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-mute);
        border-bottom: 3px solid transparent;
        margin-bottom: -2px;
        white-space: nowrap;
        transition: all 0.2s;
        border-radius: 8px 8px 0 0;
      }
      .lesson-tab:hover {
        color: var(--text);
        background: var(--bg-soft);
      }
      .lesson-tab.active {
        color: var(--primary);
        border-bottom-color: var(--primary);
        background: var(--primary-soft);
      }

      .lesson-section {
        padding: 8px 0;
      }
      .section-title {
        font-size: 22px;
        font-weight: 800;
        color: var(--text);
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .section-title .icon {
        font-size: 28px;
      }

      /* ===== Math Renderer ===== */
      .math {
        display: inline-block;
        direction: ltr;
        unicode-bidi: isolate;
        font-family: "Cambria Math", "Times New Roman", serif;
      }
      .math-block {
        display: block;
        direction: ltr;
        text-align: center;
        margin: 14px 0;
        padding: 14px;
        background: var(--bg-soft);
        border-radius: 10px;
        font-family: "Cambria Math", "Times New Roman", serif;
        font-size: 18px;
      }
      .mfrac {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        vertical-align: middle;
        margin: 0 4px;
        text-align: center;
        line-height: 1.1;
      }
      .mfrac .num {
        border-bottom: 1.5px solid currentColor;
        padding: 0 6px 2px;
        font-size: 0.95em;
      }
      .mfrac .den {
        padding: 2px 6px 0;
        font-size: 0.95em;
      }
      .msup {
        font-size: 0.7em;
        vertical-align: super;
        line-height: 0;
      }
      .msub {
        font-size: 0.7em;
        vertical-align: sub;
        line-height: 0;
      }
      .mroot {
        padding: 0 4px;
      }
      .mroot::before {
        content: "√";
        font-size: 1.1em;
        margin-left: 2px;
      }
      .mroot-n::before {
        content: "√";
        font-size: 1.1em;
        margin-left: 2px;
      }
      .mroot-n::after {
        content: "";
      }
      .mparen {
        display: inline-flex;
        align-items: center;
      }
      .mparen::before {
        content: "(";
        font-size: 1.1em;
      }
      .mparen::after {
        content: ")";
        font-size: 1.1em;
      }
      .mparen-d {
        margin: 0 3px;
      }
      .mtimes {
        margin: 0 6px;
        font-weight: 400;
        color: var(--text-mute);
      }
      .mop {
        margin: 0 4px;
        font-weight: 600;
        color: var(--primary);
      }
      .mfrac-small {
        font-size: 0.85em;
      }

      .eq-ar {
        display: inline-block;
        direction: ltr;
        font-family: "Cambria Math", serif;
        font-size: 17px;
        padding: 4px 8px;
        border-radius: 6px;
      }
      .eq-ar-block {
        display: block;
        direction: ltr;
        text-align: center;
        font-family: "Cambria Math", serif;
        font-size: 19px;
        margin: 12px 0;
        padding: 12px 16px;
        background: var(--bg-soft);
        border-radius: 8px;
        border-right: 4px solid var(--primary);
        border-left: 4px solid var(--primary);
      }

      .explain-box {
        background: var(--bg-soft);
        border-radius: 12px;
        padding: 18px;
        margin: 14px 0;
        border-right: 4px solid var(--primary);
      }
      .explain-box h5 {
        color: var(--primary);
        font-weight: 700;
        margin-bottom: 10px;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .steps {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 12px;
      }
      .step {
        display: flex;
        gap: 12px;
        padding: 12px;
        background: var(--bg-card);
        border-radius: 10px;
        border: 1px solid var(--border);
      }
      .step-num {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--primary-soft);
        color: var(--primary);
        display: grid;
        place-items: center;
        font-weight: 800;
        flex-shrink: 0;
        font-size: 13px;
      }
      .step-body {
        flex: 1;
        min-width: 0;
      }
      .step-body p {
        font-size: 14px;
        line-height: 1.8;
      }

      .law-card {
        padding: 14px;
        margin: 10px 0;
        background: var(--bg-soft);
        border-radius: 10px;
        border-right: 4px solid var(--success);
      }
      .law-title {
        font-weight: 700;
        color: var(--success);
        font-size: 14px;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .law-formula {
        display: block;
        direction: ltr;
        text-align: center;
        font-size: 18px;
        padding: 8px;
        background: var(--bg-card);
        border-radius: 6px;
        margin: 6px 0;
      }

      /* ===== Question ===== */
      .q-card {
        background: var(--bg-card);
        border-radius: var(--radius);
        padding: 22px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        margin-bottom: 16px;
        direction: ltr;
      }
      .q-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
        flex-wrap: wrap;
        gap: 8px;
      }
      .q-badge {
        padding: 4px 10px;
        background: var(--primary-soft);
        color: var(--primary);
        border-radius: 6px;
        font-size: 11px;
        font-weight: 700;
      }
      .q-badge.easy {
        background: var(--success-soft);
        color: var(--success);
      }
      .q-badge.medium {
        background: var(--warning-soft);
        color: var(--warning);
      }
      .q-badge.hard {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .q-prompt {
        font-size: 17px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 16px;
        line-height: 1.7;
      }
      .q-options {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .q-option {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        border: 2px solid var(--border);
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s;
        background: var(--bg-card);
        text-align: right;
      }
      .q-option:hover {
        border-color: var(--primary);
        background: var(--primary-soft);
        transform: translateX(-3px);
      }
      .q-option.selected {
        border-color: var(--primary);
        background: var(--primary-soft);
      }
      .q-option.correct {
        border-color: var(--success);
        background: var(--success-soft);
      }
      .q-option.wrong {
        border-color: var(--danger);
        background: var(--danger-soft);
      }
      .q-option.disabled {
        cursor: not-allowed;
        opacity: 0.85;
        pointer-events: none;
      }
      .q-letter {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: var(--bg-soft);
        color: var(--text);
        display: grid;
        place-items: center;
        font-weight: 800;
        flex-shrink: 0;
      }
      .q-option.correct .q-letter {
        background: var(--success);
        color: #fff;
      }
      .q-option.wrong .q-letter {
        background: var(--danger);
        color: #fff;
      }
      .q-option.selected .q-letter {
        background: var(--primary);
        color: #fff;
      }
      .q-text {
        flex: 1;
        min-width: 0;
      }

      .feedback {
        padding: 16px 18px;
        border-radius: 12px;
        margin-top: 14px;
        display: none;
      }
      .feedback.show {
        display: block;
        animation: slideUp 0.35s;
      }
      .feedback.correct {
        background: var(--success-soft);
        color: var(--success);
        border-right: 4px solid var(--success);
      }
      .feedback.wrong {
        background: var(--danger-soft);
        color: var(--danger);
        border-right: 4px solid var(--danger);
      }
      .feedback.warning {
        background: var(--warning-soft);
        color: var(--warning);
        border-right: 4px solid var(--warning);
      }
      .feedback h4 {
        font-weight: 800;
        margin-bottom: 6px;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .feedback p {
        font-size: 14px;
        color: var(--text);
        line-height: 1.7;
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ===== Quiz ===== */
      .quiz-progress {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
        flex-wrap: wrap;
        gap: 10px;
      }
      .quiz-bar-wrap {
        flex: 1;
        min-width: 200px;
      }
      .quiz-info {
        display: flex;
        gap: 16px;
        font-size: 13px;
        color: var(--text-soft);
        font-weight: 600;
      }

      /* ===== Exam Focus Mode ===== */
      .exam-mode .sidebar {
        display: none;
      }
      .exam-mode .main {
        margin-right: 0;
        padding: 18px;
      }
      .exam-mode .topbar-actions .icon-btn {
        display: none;
      }
      .exam-timer {
        background: var(--danger);
        color: #fff;
        padding: 8px 18px;
        border-radius: 10px;
        font-weight: 800;
        font-size: 18px;
        font-family: monospace;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .exam-timer.warning {
        background: var(--warning);
      }
      .exam-timer.danger {
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      /* ===== Modals ===== */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(15, 30, 80, 0.5);
        backdrop-filter: blur(6px);
        z-index: 1000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .modal-backdrop.show {
        display: flex;
        animation: fadeIn 0.2s;
      }
      .modal {
        background: var(--bg-card);
        border-radius: var(--radius-lg);
        padding: 28px;
        max-width: 560px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: var(--shadow-lg);
        animation: slideUp 0.3s;
      }
      .modal h3 {
        font-size: 20px;
        font-weight: 800;
        margin-bottom: 14px;
        color: var(--text);
      }
      .modal-actions {
        display: flex;
        gap: 10px;
        margin-top: 18px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      /* ===== Toast ===== */
      .toast-container {
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .toast {
        background: var(--bg-card);
        border-radius: 10px;
        padding: 12px 18px;
        box-shadow: var(--shadow-lg);
        border-right: 4px solid var(--primary);
        font-size: 14px;
        font-weight: 600;
        min-width: 240px;
        animation: slideLeft 0.3s;
      }
      .toast.success {
        border-right-color: var(--success);
      }
      .toast.error {
        border-right-color: var(--danger);
      }
      .toast.warning {
        border-right-color: var(--warning);
      }
      @keyframes slideLeft {
        from {
          opacity: 0;
          transform: translateX(-20px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ===== Achievements / Badges ===== */
      .badges-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .badge {
        width: 90px;
        padding: 14px 6px;
        background: var(--bg-soft);
        border-radius: 12px;
        text-align: center;
        border: 2px solid var(--border);
        transition: all 0.3s;
      }
      .badge.earned {
        background: var(--warning-soft);
        border-color: var(--warning);
        transform: scale(1.05);
      }
      .badge.locked {
        opacity: 0.4;
        filter: grayscale(0.8);
      }
      .badge-icon {
        font-size: 32px;
        margin-bottom: 6px;
      }
      .badge-name {
        font-size: 11px;
        font-weight: 700;
        color: var(--text);
      }

      /* ===== Stars ===== */
      .stars {
        color: var(--gold);
        font-size: 18px;
        letter-spacing: 2px;
      }
      .stars-empty {
        color: var(--border);
      }

      /* ===== Mistakes Page ===== */
      .mistake-card {
        background: var(--bg-card);
        border-radius: var(--radius);
        padding: 16px;
        margin-bottom: 12px;
        border-right: 4px solid var(--danger);
        border: 1px solid var(--border);
      }
      .mistake-meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--text-mute);
        margin-bottom: 8px;
      }

      /* ===== Number line & Graph figures ===== */
      .math-block {
        text-align: center;
        font-size: 20px;
        font-weight: 700;
        color: var(--text);
        background: var(--bg-soft);
        border-radius: 10px;
        padding: 14px;
        margin: 12px 0;
        direction: ltr;
      }
      .svg-figure {
        display: block;
        margin: 10px auto;
        max-width: 100%;
        text-align: center;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px;
      }
      .nline-plot text,
      .exp-plot text {
        font-family: inherit;
        font-size: 12px;
        fill: var(--text-mute);
      }
      .nline-point {
        fill: var(--primary);
        stroke: var(--bg-card);
        stroke-width: 2;
      }
      .nline-pt-label {
        fill: var(--primary);
        font-weight: 700;
      }
      .exp-curve {
        fill: none;
        stroke: var(--primary);
        stroke-width: 2.5;
      }
      .exp-hline {
        stroke: var(--danger);
        stroke-width: 1.6;
        stroke-dasharray: 5 4;
      }
      .exp-point {
        fill: var(--danger);
      }

      /* ===== Order (رتب) chips ===== */
      .order-wrap {
        margin-top: 10px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        margin: 4px;
        border-radius: 20px;
        background: var(--bg-soft);
        border: 2px solid var(--border);
        font-size: 14px;
        cursor: pointer;
        user-select: none;
        transition: all 0.15s ease;
      }
      .chip:hover:not(.disabled) {
        border-color: var(--primary);
      }
      .chip.disabled {
        opacity: 0.45;
        cursor: default;
      }
      .order-slots {
        min-height: 44px;
        margin-top: 10px;
        padding: 8px;
        border: 2px dashed var(--border);
        border-radius: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .order-slot {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 8px;
        background: var(--primary-soft);
        border: 1px solid var(--primary);
        font-size: 13px;
        font-weight: 700;
      }

      /* ===== Match (صِل) drag & drop ===== */
      .match-wrap {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .match-col {
        flex: 1 1 220px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .match-item {
        padding: 10px 12px;
        border-radius: 10px;
        border: 2px solid var(--border);
        background: var(--bg-card);
        font-size: 14px;
        cursor: pointer;
        user-select: none;
        transition: all 0.15s ease;
        text-align: center;
      }
      .match-item.left {
        background: var(--primary-soft);
      }
      .match-item.right {
        background: var(--bg-soft);
      }
      .match-item.sel {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px var(--primary-soft);
      }
      .match-item.matched {
        border-color: var(--success);
        background: var(--success-soft);
      }
      .match-item[draggable="true"] {
        cursor: grab;
      }
      .match-item.drag-over {
        border-color: var(--warning);
      }

      /* ===== Daily challenge ===== */
      .challenge-banner {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        background: var(--grad-1);
        color: #fff;
        border-radius: var(--radius);
        padding: 18px;
        margin-bottom: 18px;
      }
      .challenge-banner h3 {
        font-size: 18px;
        margin-bottom: 4px;
      }
      .challenge-banner p {
        opacity: 0.92;
        font-size: 13px;
      }
      .challenge-banner .big-emoji {
        font-size: 42px;
      }
      .challenge-day {
        background: rgba(255, 255, 255, 0.18);
        padding: 4px 10px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 700;
      }
      .challenge-history {
        margin-top: 8px;
        font-size: 13px;
        color: var(--text-mute);
      }

      /* ===== Mobile ===== */
      @media (max-width: 900px) {
        .sidebar {
          top: auto;
          right: 0;
          bottom: 0;
          left: 0;
          width: 100%;
          height: 74px;
          padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
          border-top: 1px solid var(--border);
          border-left: 0;
          overflow: visible;
          transform: none;
          display: block;
        }
        .sidebar .brand,
        .sidebar .lesson-nav,
        .sidebar .nav-title {
          display: none;
        }
        .sidebar .mobile-nav {
          display: flex;
          align-items: stretch;
          justify-content: space-around;
          gap: 2px;
          height: 100%;
          margin: 0;
        }
        .sidebar .nav-item {
          flex: 1;
          min-width: 0;
          margin: 0;
          padding: 4px 2px;
          border-radius: 9px;
          flex-direction: column;
          justify-content: center;
          gap: 0;
          font-size: 10px;
          line-height: 1.25;
          text-align: center;
        }
        .sidebar .nav-item .icon {
          width: auto;
          font-size: 18px;
          line-height: 1.2;
        }
        .sidebar .nav-item::after {
          display: none;
        }
        .main {
          margin-right: 0;
          padding: 18px 14px 94px;
        }
        .hero h2 {
          font-size: 22px;
        }
        .hero {
          padding: 22px;
        }
        .stat-card .stat-value {
          font-size: 22px;
        }
        .lesson-tabs {
          position: sticky;
          top: 0;
          z-index: 20;
          width: 100%;
          max-width: 100%;
          margin: 0 0 18px;
          padding: 8px 0 9px;
          background: var(--bg);
          border-bottom: 1px solid var(--border);
          overflow-x: auto;
          overflow-y: hidden;
          overscroll-behavior-x: contain;
          scroll-snap-type: x proximity;
          --webkit-overflow-scrolling: touch;
          touch-action: pan-x;
        }
        .lesson-tab {
          flex: 0 0 auto;
          scroll-snap-align: start;
          padding: 9px 12px;
          font-size: 12px;
          min-height: 40px;
        }
      }
      @media (max-width: 480px) {
        .hero h2 {
          font-size: 18px;
        }
        .hero p {
          font-size: 14px;
        }
        .lesson-tab {
          padding: 10px 12px;
          font-size: 12px;
        }
        .section-title {
          font-size: 18px;
        }
      }

      /* ===== Animations ===== */
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }
      .bounce {
        animation: bounce 0.6s;
      }
      .confetti {
        position: fixed;
        width: 10px;
        height: 10px;
        pointer-events: none;
        z-index: 9999;
      }

      /* ===== Tables ===== */
      .data-table {
        width: 100%;
        border-collapse: collapse;
        margin: 14px 0;
        background: var(--bg-card);
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .data-table th,
      .data-table td {
        padding: 10px 12px;
        text-align: right;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
      }
      .data-table th {
        background: var(--bg-soft);
        font-weight: 700;
        color: var(--text);
      }
      .data-table tr:last-child td {
        border-bottom: 0;
      }
      .data-table tr:hover {
        background: var(--bg-soft);
      }

      /* ===== Completion screen ===== */
      .complete-screen {
        text-align: center;
        padding: 30px 20px;
      }
      .complete-screen .trophy {
        font-size: 80px;
        animation: bounce 1s infinite;
      }
      .complete-screen h2 {
        font-size: 26px;
        color: var(--text);
        margin: 14px 0 6px;
      }
      .complete-screen p {
        color: var(--text-mute);
        font-size: 15px;
        margin-bottom: 18px;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-soft);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-mute);
      }

      /* Focus visible */
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid var(--primary);
        outline-offset: 2px;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-logo">دز</div>
          <div class="brand-info">
            <h1>أ. ديفيد زكي</h1>
            <p>الصف الثالث الإعدادي</p>
          </div>
        </div>

        <div class="nav-section mobile-nav">
          <div class="nav-title">القائمة الرئيسية</div>
          <button
            class="nav-item active"
            data-page="dashboard"
            onclick="navigate('dashboard')"
          >
            <span class="icon">🏠</span><span>الرئيسية</span>
          </button>
          <button class="nav-item" data-page="unit" onclick="navigate('unit')">
            <span class="icon">📘</span><span>الوحدة الأولى</span>
          </button>
          <button
            class="nav-item"
            data-page="mistakes"
            onclick="navigate('mistakes')"
          >
            <span class="icon">⚠️</span><span>أخطائي</span>
          </button>
          <button
            class="nav-item"
            data-page="achievements"
            onclick="navigate('achievements')"
          >
            <span class="icon">🏆</span><span>الإنجازات</span>
          </button>
          <button
            class="nav-item"
            data-page="progress"
            onclick="navigate('progress')"
          >
            <span class="icon">📈</span><span>تقدمي</span>
          </button>
          <button
            class="nav-item"
            data-page="challenge"
            onclick="navigate('challenge')"
          >
            <span class="icon">🔥</span><span>تحدي اليوم</span>
          </button>
          <button
            class="nav-item"
            data-page="settings"
            onclick="navigate('settings')"
          >
            <span class="icon">⚙️</span><span>الإعدادات</span>
          </button>
        </div>

        <div class="nav-section lesson-nav">
          <div class="nav-title">الوحدة الأولى</div>
          <div id="sidebarLessons"></div>
        </div>
      </aside>

      <!-- Main -->
      <main class="main">
        <div class="topbar">
          <div class="topbar-info">
            <h2 id="studentGreeting">مرحباً بك يا بطل 👋</h2>
            <h3 id="topbarTitle">
              الوحدة الأولى — الأعداد النسبية والقوى والمعادلات الأسية
            </h3>
          </div>
          <div class="topbar-actions">
            <button
              class="icon-btn"
              onclick="toggleTheme()"
              aria-label="تغيير المظهر"
              title="تغيير المظهر"
            >
              🌓
            </button>
            <button
              class="icon-btn"
              onclick="toggleSound()"
              aria-label="الصوت"
              title="الصوت"
              id="soundBtn"
            >
              🔊
            </button>
          </div>
        </div>

        <!-- Pages -->
        <section class="page active" id="page-dashboard"></section>
        <section class="page" id="page-unit"></section>
        <section class="page" id="page-lesson"></section>
        <section class="page" id="page-quiz"></section>
        <section class="page" id="page-exam"></section>
        <section class="page" id="page-results"></section>
        <section class="page" id="page-mistakes"></section>
        <section class="page" id="page-achievements"></section>
        <section class="page" id="page-progress"></section>
        <section class="page" id="page-challenge"></section>
        <section class="page" id="page-settings"></section>
        <section class="page" id="page-completion"></section>
      </main>
    </div>

    <!-- Modal -->
    <div
      class="modal-backdrop"
      id="modal"
      onclick="if (event.target === this) closeModal();"
    >
      <div class="modal" id="modalBody"></div>
    </div>

    <!-- Toast -->
    <div class="toast-container" id="toasts"></div>

    <script>
      /* ============================ STATE ============================ */
      const STATE_VERSION = 1;
      const DEFAULT_STATE = {
        version: STATE_VERSION,
        student: { name: "بطل", joinedAt: Date.now() },
        currentLesson: 1,
        currentSection: 0,
        completedLessons: [],
        completedSections: {},
        quizResults: {},
        examResults: {},
        stars: 0,
        badges: [],
        mistakes: [],
        skillMastery: {},
        activeExam: null,
        lastLesson: 1,
        theme: "light",
        sound: true,
        difficultyPref: "all",
        challenges: [],
        lastChallenge: null,
        startTime: Date.now(),
      };
      let state = loadState();

      function loadState() {
        try {
          const raw = localStorage.getItem("dz_math_unit1");
          if (!raw) return structuredClone(DEFAULT_STATE);
          const saved = JSON.parse(raw);
          if (!saved.version || saved.version !== STATE_VERSION) {
            const merged = Object.assign(structuredClone(DEFAULT_STATE), saved);
            merged.version = STATE_VERSION;
            return merged;
          }
          return Object.assign(structuredClone(DEFAULT_STATE), saved);
        } catch (e) {
          return structuredClone(DEFAULT_STATE);
        }
      }
      function saveState() {
        try {
          localStorage.setItem("dz_math_unit1", JSON.stringify(state));
        } catch (e) {}
      }

      /* ============================ CURRICULUM ============================ */
      const CURRICULUM = {
        title: "الوحدة الأولى — الأعداد النسبية والقوى والمعادلات الأسية",
        grade: "الصف الثالث الإعدادي",
        teacher: "أستاذ ديفيد زكي",
        description:
          "تتناول هذه الوحدة القوى في الأعداد النسبية، ضرب وقسمة القوى، القوى ذات الأس الصفري والسالب، قوى القوى، ثم المعادلات الأسية وطرق حلها والمعادلات الأسية المتجانسة، وتطبيقاتها الحياتية.",
        lessons: [
          {
            id: 1,
            title: "القوى",
            shortTitle: "القوى",
            outcomes: [
              "يتعرّف مفهوم القوة والأساس والأس.",
              "يحسب قيمة القوى للأعداد النسبية.",
              "يطبّق قواعد ضرب وقسمة القوى.",
              "يحسب القوى ذات الأس الصفري والأس السالب.",
              "يطبّق قاعدة قوة القوة.",
            ],
            sections: [
              { key: "intro", title: "التهيئة", icon: "🎯" },
              { key: "remember", title: "الذاكر", icon: "🧠" },
              { key: "explore", title: "الاستكشاف", icon: "🔍" },
              { key: "learn", title: "القوانين والنظريات", icon: "📚" },
              { key: "examples", title: "أمثلة محلولة", icon: "💡" },
              { key: "activity", title: "نشاط تفاعلي", icon: "🎮" },

      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];

      function compatQuestions(bank) {
        return bank.filter(
          (q) =>

            q.type === "number" ||
            q.type === "fill" ||
            q.type === "error",
        );

      function buildTest(bank, counts) {
        const comp = compatQuestions(bank);
        const total = counts.reduce((a, b) => a + b, 0);
        if (state.difficultyPref && state.difficultyPref !== "all") {
          const pool = comp.filter(
            (q) => q.difficulty === state.difficultyPref,
          );
          if (pool.length >= total) return pickRandom(pool, total);
        }
        const easy = pickRandom(
          comp.filter((q) => q.difficulty === "easy"),
          counts[0],
        );
        const med = pickRandom(
          comp.filter((q) => q.difficulty === "medium"),
          counts[1],
        );
        const hard = pickRandom(
          comp.filter((q) => q.difficulty === "hard"),
          counts[2],
        );
        return [...easy, ...med, ...hard];
      }

      /* ===== Inline SVG: number line & exponential graph ===== */
      const SUPS_NUM = {
        "0": "⁰",
        "1": "¹",
        "2": "²",
        "3": "³",
        "4": "⁴",
        "5": "⁵",
        "6": "⁶",
        "7": "⁷",

        "9": "⁹",
        "-": "⁻",
      };
      function toSup(n) {
        return String(n)
          .split("")
          .map((c) => SUPS_NUM[c] || c)
          .join("");
      }
      function numberLineFigure(caption, points, labels) {
        return `<div class="svg-figure"><div style="font-weight:700;font-size:14px;margin-bottom:4px;direction:rtl">${caption}</div>${nlineSVG(points, labels)}</div>`;
      }
      function nlineSVG(points, labels) {
        const rmin = -6,
          rmax = 6;
        const W = 560,
          L = 44,
          R = 30,
          axisY = 60;
        const px = (v) => L + ((v - rmin) / (rmax - rmin)) * (W - L - R);
        let ticks = "";
        for (let v = rmin; v <= rmax; v++) {
          ticks += `<line x1="${px(v)}" x2="${px(v)}" y1="${axisY - 8}" y2="${axisY - 4}" stroke="var(--text-mute)" stroke-width="2"/>`;
          ticks += `<text x="${px(v)}" y="${axisY + 22}" text-anchor="middle">${v}</text>`;
        }
        let pts = "";
        (points || []).forEach((v, i) => {
          pts += `<circle class="nline-point" cx="${px(v)}" cy="${axisY - 30}" r="8"/>`;
          pts += `<text class="nline-pt-label" x="${px(v)}" y="${axisY - 42}" text-anchor="middle">${labels && labels[i] ? labels[i] : v}</text>`;
          pts += `<line x1="${px(v)}" x2="${px(v)}" y1="${axisY - 22}" y2="${axisY - 12}" stroke="var(--primary)" stroke-width="2" stroke-dasharray="3 3"/>`;
        });
        const arrowL = `<polygon points="${L - 8},${axisY - 38} ${L - 8},${axisY - 24} ${L - 18},${axisY - 31}" fill="var(--text)"/>`;
        const arrowR = `<polygon points="${W - R + 8},${axisY - 38} ${W - R + 8},${axisY - 24} ${W - R + 18},${axisY - 31}" fill="var(--text)"/>`;
        return `<svg class="nline-plot" viewBox="0 0 ${W} 92" role="img" aria-label="خط الأعداد" style="max-width:560px">
      <line x1="${L - 8}" x2="${W - R + 8}" y1="${axisY - 31}" y2="${axisY - 31}" stroke="var(--text)" stroke-width="2"/>
      ${arrowL}${arrowR}
      ${ticks}${pts}
    </svg>`;
      }
      function expGraphFigure(caption) {
        return `<div class="svg-figure"><div style="font-weight:700;font-size:14px;margin-bottom:4px;direction:rtl">${caption}</div>${expGraphSVG(2, 8, -2, 4)}</div>`;
      }
      function expGraphSVG(base, target, xmin, xmax) {
        const W = 560,
          H = 340,
          L = 48,
          R = 24,
          T = 24,
          B = 46;
        const xsol = Math.log(target) / Math.log(base);
        const ymax = Math.max(Math.pow(base, xmax), target) + 2;
        let m = Math.pow(10, Math.floor(Math.log10(ymax)));
        let step = m;
        if (ymax / m > 5) step = m;
        else if (ymax / m > 2) step = m / 2;
        else step = m / 5;
        const px = (v) => L + ((v - xmin) / (xmax - xmin)) * (W - L - R);
        const py = (v) => T + (1 - v / ymax) * (H - T - B);
        let grid = "";
        for (let y = step; y <= ymax + 0.001; y += step) {
          grid += `<line class="exp-grid" x1="${L}" x2="${W - R}" y1="${py(y)}" y2="${py(y)}" stroke="var(--border)" stroke-width="1"/>`;
          grid += `<text x="${L - 8}" y="${py(y) + 4}" text-anchor="end">${Math.round(y * 100) / 100}</text>`;
        }
        grid += `<text x="${L - 8}" y="${py(0) + 4}" text-anchor="end">0</text>`;
        let xticks = "";
        for (let x = xmin; x <= xmax; x++) {
          xticks += `<line x1="${px(x)}" x2="${px(x)}" y1="${py(0)}" y2="${py(0) + 6}" stroke="var(--text-mute)" stroke-width="1.4"/>`;
          xticks += `<text x="${px(x)}" y="${py(0) + 22}" text-anchor="middle">${x}</text>`;
        }
        const pts = [];
        for (let i = 0; i <= 120; i++) {
          const x = xmin + (i / 120) * (xmax - xmin);
          pts.push(px(x).toFixed(1) + "," + py(Math.pow(base, x)).toFixed(1));
        }
        const axes = `
      <line x1="${L}" x2="${W - R}" y1="${py(0)}" y2="${py(0)}" stroke="var(--text)" stroke-width="1.6"/>
      <line x1="${L}" x2="${L}" y1="${py(0)}" y2="${T}" stroke="var(--text)" stroke-width="1.6"/>
      <polygon points="${L - 6},${T + 8} ${L},${T} ${L + 6},${T + 8}" fill="var(--text)"/>
      <polygon points="${W - R - 8},${py(0) - 6} ${W - R},${py(0)} ${W - R - 8},${py(0) + 6}" fill="var(--text)"/>`;
        return `<svg class="exp-plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="التمثيل البياني للمعادلة ${base} أس x = ${target}" style="max-width:560px">
      ${grid}${axes}
      <polyline class="exp-curve" points="${pts.join(" ")}"/>
      <line class="exp-hline" x1="${L}" x2="${W - R}" y1="${py(target)}" y2="${py(target)}"/>
      <text x="${W - R}" y="${py(target) - 6}" text-anchor="end" fill="var(--danger)" font-weight="700">y = ${target}</text>
      <circle class="exp-point" cx="${px(xsol)}" cy="${py(target)}" r="6"/>
      <text x="${px(xsol) - 10}" y="${py(target) - 10}" text-anchor="end" fill="var(--danger)" font-weight="700">${base}${toSup(Math.round(xsol))} = ${target}</text>
      ${xticks}
    </svg>`;
      }

        return (
          d.getFullYear() +
          "-" +
          String(d.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(d.getDate()).padStart(2, "0")
        );
      }
      function todaySeed() {
        const k = todayKey();
        let s = 7;
        for (let i = 0; i < k.length; i++)
          s = (s * 31 + k.charCodeAt(i)) % 2147483647;
        return s;
      }
      function seededShuffle(arr, seed) {
        const a = [...arr];
        let rnd = seed;
        for (let i = a.length - 1; i > 0; i--) {
          rnd = (rnd * 9301 + 49297) % 233280;
          const j = Math.floor((rnd / 233280) * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }
      function challengeQuestions() {
        const comp = compatQuestions([...L1_QUESTIONS, ...L2_QUESTIONS]);
        return seededShuffle(comp, todaySeed()).slice(0, 5);
      }
      let CHAL = { questions: [], idx: 0, score: 0, answered: 0, results: [] };
      function todayDone() {

      function selectChallengeAnswer(el, chosen, correct, expl) {
        const card = el.closest(".q-card");

        opts.forEach((o) => o.classList.add("disabled"));

          el.classList.add("correct");
          CHAL.score++;

          el.classList.add("wrong");
          state.streak = 0;

            if (o.querySelector(".q-text").textContent.trim() === correct)

          recordMistake(q);
          chalFeedback(false, expl, card, correct, chosen);
          speak("حاول مرة أخرى");

          page.classList.add("active");

          window.scrollTo({ top: 0, behavior: "smooth" });
        }
        const navItem = $$('.nav-item[data-page="' + pageId + '"]')[0];
        if (navItem) navItem.classList.add("active");

        if (title) {
          if (pageId === "dashboard")
            title.textContent =
              "الوحدة الأولى — الأعداد النسبية والقوى والمعادلات الأسية";
          else if (pageId === "unit")
            title.textContent = "الوحدة الأولى — الدروس";
          else if (pageId === "lesson") title.textContent = "الدرس";
          else if (pageId === "quiz") title.textContent = "اختبار قصير";
          else if (pageId === "exam") title.textContent = "امتحان";
          else if (pageId === "results") title.textContent = "النتائج";
          else if (pageId === "mistakes") title.textContent = "أخطائي";
          else if (pageId === "achievements") title.textContent = "الإنجازات";
          else if (pageId === "progress") title.textContent = "تقدمي";
          else if (pageId === "challenge") title.textContent = "التحدي اليومي";

        if (!state.sound || !("speechSynthesis" in window)) return;
        try {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = "ar-EG";
          u.rate = 0.95;
          u.pitch = 1;
          speechSynthesis.cancel();
          speechSynthesis.speak(u);

        for (let i = 0; i < 30; i++) {

          const isFirst = i === 0;
          const isPrevDone =

            state.completedLessons.includes(CURRICULUM.lessons[i - 1].id);
          const isUnlocked = isFirst || isPrevDone;
          const completed = state.completedLessons.includes(l.id);
          btn.className =
            "nav-item" +
            (completed ? " completed" : "") +
            (isUnlocked ? "" : " locked");
          btn.innerHTML = `<span class="icon">${completed ? "✓" : l.id === 1 ? "⚡" : "🧩"}</span><span>الدرس ${l.id}: ${l.shortTitle}</span>`;

            if (!isUnlocked) {
              toast("🔒 افتح الدرس السابق أولًا", "warning");
              return;

            openLesson(l.id);
          };
          cont.appendChild(btn);
        });

      /* ============================ DASHBOARD ============================ */
      function computeStats() {
        const quizAttempts = Object.entries(state.quizResults)
          .filter(([key]) => !key.endsWith("_best"))
          .map(([, q]) => q);
        const examAttempts = Object.entries(state.examResults)
          .filter(([key]) => !key.endsWith("_best"))
          .map(([, q]) => q);
        const totalQAnswered =
          quizAttempts.reduce((s, q) => s + (q.answered || 0), 0) +
          examAttempts.reduce((s, q) => s + (q.answered || 0), 0);
        const quizScores = quizAttempts.map((q) => (q.score / q.total) * 100);
        const examScores = examAttempts.map((q) => (q.score / q.total) * 100);
        const allScores = [...quizScores, ...examScores].filter(
          (x) => !isNaN(x),
        );
        const avgScore = allScores.length ? avg(allScores) : 0;
        const maxScore = allScores.length ? Math.max(...allScores) : 0;
        const completedLessons = state.completedLessons.length;
        const completedExams = Object.keys(state.examResults).length;
        const totalLessons = CURRICULUM.lessons.length;
        const progressPct = Math.round((completedLessons / totalLessons) * 100);
        return {
          totalQAnswered,
          avgScore,
          maxScore,
          completedLessons,
          completedExams,
          totalLessons,
          progressPct,
          allScores,
        };
      }

      /* ============================ LESSON ENGINE ============================ */
      let CURRENT = {
        lessonId: 1,

        questions: [],

        score: 0,
        answered: 0,
        streak: 0,

        state.lastLesson = lessonId;

        CURRENT.sectionIdx = 0;
        CURRENT.lessonData = lessonId === 1 ? LESSON1 : LESSON2;
        navigate("lesson");
        renderLessonSection();
      }

      function renderLessonSection() {
        const lesson = CURRICULUM.lessons.find(
          (l) => l.id === CURRENT.lessonId,
        );
        const section = lesson.sections[CURRENT.sectionIdx];
        const sectionKey = section.key;
        $("#topbarTitle").textContent = `الدرس ${lesson.id} - ${lesson.title}`;
        let tabs = lesson.sections
          .map((s, i) => {
            const completed = (
              state.completedSections[CURRENT.lessonId] || []
            ).includes(s.key);
            return `<button class="lesson-tab ${i === CURRENT.sectionIdx ? "active" : ""} ${completed ? "completed" : ""}" onclick="goToSection(${i})" style="${completed ? "color:var(--success);" : ""}">
      ${s.icon} ${s.title}
    </button>`;
          })
          .join("");

        // Add exam CTA at end
        tabs += `<button class="lesson-tab" style="background:var(--danger-soft);color:var(--danger);font-weight:700;margin-bottom:-2px" onclick="startExam(${lesson.id})">📝 امتحان الدرس</button>`;

        else if (sectionKey === "remember") body = renderRemember(lesson);
        else if (sectionKey === "explore") body = renderExplore(lesson);
        else if (sectionKey === "learn") body = renderLearn(lesson);
        else if (sectionKey === "examples") body = renderExamples(lesson);
        else if (sectionKey === "activity") body = renderActivity(lesson);
        else if (sectionKey === "practice") body = renderPractice(lesson);

          startQuiz();

        $("#page-lesson").innerHTML = `
    <div class="lesson-tabs">${tabs}</div>
    <div class="lesson-section">${body}</div>
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap;gap:10px">
      <button class="btn btn-ghost" onclick="goToSection(${CURRENT.sectionIdx - 1})" ${CURRENT.sectionIdx === 0 ? "disabled" : ""}>← السابق</button>
      <span style="color:var(--text-mute);font-size:13px">القسم ${CURRENT.sectionIdx + 1} من ${lesson.sections.length}</span>
      ${
        CURRENT.sectionIdx < lesson.sections.length - 1
          ? `<button class="btn btn-primary" onclick="completeAndNext()">التالي →</button>`
          : `<button class="btn btn-success" onclick="finishLesson()">🏁 إنهاء الدرس</button>`
      }
    </div>
  `;
        if (sectionKey === "activity") {
          if (CURRENT.lessonId === 1) showPowerQ();
          else showExpQ();

      function goToSection(idx) {
        if (
          idx < 0 ||
          idx >=
            CURRICULUM.lessons.find((l) => l.id === CURRENT.lessonId).sections
              .length
        )
          return;
        CURRENT.sectionIdx = idx;
        renderLessonSection();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function completeAndNext() {
        const lesson = CURRICULUM.lessons.find(
          (l) => l.id === CURRENT.lessonId,
        );
        const sectionKey = lesson.sections[CURRENT.sectionIdx].key;
        if (!state.completedSections[CURRENT.lessonId])
          state.completedSections[CURRENT.lessonId] = [];
        if (!state.completedSections[CURRENT.lessonId].includes(sectionKey)) {
          state.completedSections[CURRENT.lessonId].push(sectionKey);
          saveState();
        }
        if (CURRENT.sectionIdx < lesson.sections.length - 1) {
          CURRENT.sectionIdx++;
          renderLessonSection();
        } else finishLesson();
        window.scrollTo({ top: 0, behavior: "smooth" });

      function orderBody(q) {

          <button class="btn btn-primary" type="button" onclick="orderCommit(this)">تحقق من الترتيب</button>
          <button class="btn btn-ghost" type="button" onclick="orderReset(this)">↺ إعادة</button>
        </div>
      </div>`;

      function matchBody(q) {

        const right = q.options.right;

        <div class="match-col">
          ${left
            .map(
              (l, li) =>
                `<div class="match-item left" data-li="${li}" data-label="${escapeHtml(l)}" draggable="true" ondragstart="matchDragStart(event,${li})" onclick="matchPickLeft(this)">${renderMathPrompt(l)}</div>`,
            )
            .join("")}
        </div>
        <div class="match-col">
          ${right
            .map(
              (r, ri) =>
                `<div class="match-item right" data-ri="${ri}" onclick="matchPickRight(this,${ri})" ondragover="matchDragOver(event)" ondragleave="this.classList.remove('drag-over')" ondrop="matchDrop(event,${ri})">${renderMathPrompt(r)}</div>`,
            )
            .join("")}
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="btn btn-primary" type="button" onclick="matchCommit(this)">تحقق من الوصل</button>
        <button class="btn btn-ghost" type="button" onclick="matchReset(this)">↺ إعادة</button>
      </div>
      <p style="margin-top:8px;font-size:12px;color:var(--text-mute)">💡 اضغط عنصرًا من القائمة الأولى ثم عنصرًا من الثانية لتوصيلهما، أو اسحب وأفلت.</p>`;
      }

      function checkPractice(el) {
        const card = el.closest(".q-card");
        if (card.dataset.answered === "true") return;
        card.dataset.answered = "true";
        const opts = card.querySelectorAll(".q-option");
        opts.forEach((o) => o.classList.add("disabled"));

          speak("إجابة صحيحة");

          el.classList.add("wrong");

          });

            "<h4>✗ ليست الإجابة الصحيحة</h4><p>الإجابة الصحيحة: <b>" +
            correct +
            "</b></p>";

      function checkPracticeInput(input) {
        const card = input.closest(".q-card");

      /* ===== Order interactions ===== */
      function orderPick(el) {
        const card = el.closest(".q-card");
        if (card.dataset.answered === "true") return;
        if (el.classList.contains("disabled")) return;
        const slots = card.querySelector(".order-slots");
        const slot = document.createElement("span");
        slot.className = "order-slot";
        slot.textContent = el.dataset.v;
        slots.appendChild(slot);
        el.classList.add("disabled");
        speak(slot.textContent);
      }
      function orderReset(el) {
        const card = el.closest(".q-card");
        card.querySelector(".order-slots").innerHTML = "";
        card.querySelectorAll(".chip").forEach((c) => {
          c.classList.remove("disabled");
        });
        card.dataset.answered = "false";
        const fb = card.querySelector(".feedback");
        if (fb) {
          fb.className = "feedback";
          fb.innerHTML = "";
        }
      }
      function orderCommit(el) {
        const card = el.closest(".q-card");
        if (card.dataset.answered === "true") return;
        const correct = JSON.parse(card.dataset.order);
        const chosen = Array.from(
          card.querySelectorAll(".order-slot"),

            "<h4>⚠️ لم تكمل الترتيب</h4><p>رتّب جميع العبارات (المطلوب " +
            correct.length +

          return;

        const slots = card.querySelectorAll(".order-slot");
        slots.forEach((s) => s.classList.add("disabled"));
        card.dataset.answered = "true";
        const fb = card.querySelector(".feedback");
        const isCorrect = chosen.join("|") === correct.join("|");
        if (isCorrect) {
          fb.className = "feedback correct show";
          fb.innerHTML = "<h4>✓ ترتيب صحيح!</h4><p>أحسنت.</p>";

      /* ===== Match interactions (click or drag&drop) ===== */
      function matchCardMaps(card) {
        if (!card._pairs) card._pairs = {};
        return card._pairs;
      }
      function matchRefresh(card) {
        const pairs = matchCardMaps(card);
        const leftEls = card.querySelectorAll(".match-item.left");
        const rightEls = card.querySelectorAll(".match-item.right");
        leftEls.forEach((le) => {
          le.classList.toggle("matched", pairs[le.dataset.li] !== undefined);
        });
        rightEls.forEach((re) => {
          const used = Object.values(pairs).includes(Number(re.dataset.ri));
          re.classList.toggle("matched", used);
        });
      }
      function matchUnselect(card) {
        card._selLi = null;
        card
          .querySelectorAll(".match-item.left.sel")
          .forEach((e) => e.classList.remove("sel"));
      }
      function matchPickLeft(el) {
        const card = el.closest(".q-card");
        if (card.dataset.answered === "true") return;
        if (el.classList.contains("matched")) return;
        matchUnselect(card);
        card._selLi = el.dataset.li;
        el.classList.add("sel");
      }
      function matchPickRight(el, ri) {
        const card = el.closest(".q-card");
        if (card.dataset.answered === "true") return;
        const li = card._selLi;
        if (li === undefined || li === null) {
          for (const k in card._pairs || {}) {
            if (card._pairs[k] === ri) {
              delete card._pairs[k];
            }
          }
          matchRefresh(card);
          return;
        }
        const pairs = matchCardMaps(card);
        for (const k in pairs) {
          if (pairs[k] === ri) delete pairs[k];
        }
        if (pairs[li] === ri) delete pairs[li];
        else pairs[li] = ri;
        matchUnselect(card);
        matchRefresh(card);
      }
      function matchDragStart(ev, li) {
        const el = ev.currentTarget;
        const card = el.closest(".q-card");
        if (card.dataset.answered === "true") {
          ev.preventDefault();
          return;
        }
        matchUnselect(card);
        card._selLi = String(li);
        el.classList.add("sel");
        ev.dataTransfer.effectAllowed = "move";
        ev.dataTransfer.setData("text/plain", String(li));
      }
      function matchDragOver(ev) {
        ev.preventDefault();
        ev.currentTarget.classList.add("drag-over");
      }
      function matchDrop(ev, ri) {
        ev.preventDefault();
        ev.currentTarget.classList.remove("drag-over");
        matchPickRight(ev.currentTarget, ri);
      }
      function matchReset(el) {
        const card = el.closest(".q-card");
        card._pairs = {};
        card._selLi = null;
        card.dataset.answered = "false";
        matchRefresh(card);
        const fb = card.querySelector(".feedback");
        if (fb) {
          fb.className = "feedback";
          fb.innerHTML = "";
        }
      }
      function matchCommit(el) {
        const card = el.closest(".q-card");
        if (card.dataset.answered === "true") return;
        const pairs = matchCardMaps(card);
        const expected = JSON.parse(card.dataset.match);
        const leftArr = JSON.parse(card.dataset.left);
        const rightArr = JSON.parse(card.dataset.right);
        const expectedMap = {};
        expected.forEach(([l, r]) => {
          expectedMap[leftArr.indexOf(l)] = rightArr.indexOf(r);
        });
        const expectedCount = Object.keys(expectedMap).length;
        const gotCount = Object.keys(pairs).length;
        const fb = card.querySelector(".feedback");
        if (gotCount !== expectedCount) {
          fb.className = "feedback warning show";
          fb.innerHTML =
            "<h4>⚠️ لم تكمل الوصل</h4><p>وصّل جميع الأزواج (المطلوب " +
            expectedCount +
            ") ثم اضغط تحقق.</p>";
          return;
        }
        let ok = true;
        for (const k in expectedMap) {
          if (pairs[k] !== expectedMap[k]) {
            ok = false;
            break;
          }
        }
        card.dataset.answered = "true";
        if (ok) {
          fb.className = "feedback correct show";
          fb.innerHTML = "<h4>✓ وصل صحيح!</h4><p>أحسنت.</p>";
          speak("وصل صحيح");
        } else {
          const lines = expected
            .map(([l, r]) => "<li>" + l + " ⟶ " + r + "</li>")
            .join("");
          fb.className = "feedback wrong show";
          fb.innerHTML =
            "<h4>✗ الوصل غير صحيح</h4><p>الأزواج الصحيحة:</p><ol style='margin-right:16px'>" +
            lines +
            "</ol>";
          speak("حاول مرة أخرى");
        }
      }

      function selectQuizAnswer(el, chosen, correct, expl) {

      function normalizeAnswer(value) {
        const superscripts = {
          "⁰": "0",
          "¹": "1",
          "²": "2",
          "³": "3",
          "⁴": "4",
          "⁵": "5",
          "⁶": "6",
          "⁷": "7",
          "⁸": "8",
          "⁹": "9",
          "⁻": "-",
          "⁺": "+",
        };
        return String(value || "")
          .trim()
          .replace(/[٠-٩]/g, (digit) => "٠١٢٣٤٥٦٧٨٩".indexOf(digit))
          .replace(
            /[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]+/g,
            (sequence) =>
              "^" +
              Array.from(sequence)
                .map((character) => superscripts[character])
                .join(""),
          )
          .replace(/[×]/g, "*")
          .replace(/[÷]/g, "/")
          .replace(/[−–]/g, "-")
          .replace(/\s+/g, "");
      }

      function answersEquivalent(answer, expectedRaw) {
        const expected = String(expectedRaw || "");
        if (expected.includes("|")) {
          return expected.split("|").some((alt) => answersEquivalent(answer, alt));
        }
        const actual = normalizeAnswer(answer);
        const correct = normalizeAnswer(expected);
        if (actual === correct) return true;
        const numericPattern = /^[0-9+\-*/().^]+$/;
        if (!numericPattern.test(actual) || !numericPattern.test(correct))
          return false;
        try {
          const actualValue = Function(
            `"use strict"; return (${actual.replace(/\^/g, "**")});`,
          )();
          const correctValue = Function(
            `"use strict"; return (${correct.replace(/\^/g, "**")});`,
          )();
          return (
            Number.isFinite(actualValue) &&
            Number.isFinite(correctValue) &&
            Math.abs(actualValue - correctValue) < 1e-10
          );
        } catch (error) {
          return false;
        }
      }

      function selectQuizAnswerText(correct, expl) {
        const v = document.getElementById("quizAns").value.trim();
        const card = document.querySelector(".q-card");
        if (card.dataset.answered === "true") return;
        card.dataset.answered = "true";
        document.getElementById("quizAns").disabled = true;
        const isCorrect = answersEquivalent(v, correct);
        if (isCorrect) {
          QUIZ.score++;
          state.streak = (state.streak || 0) + 1;
          showQuizFeedback(true, expl, card);
          speak("إجابة صحيحة");
        } else {
          state.streak = 0;
          recordMistake(QUIZ.questions[QUIZ.idx]);
          showQuizFeedback(false, expl, card, correct, v);
          speak("حاول مرة أخرى");
        }
        QUIZ.answered++;
        QUIZ.results.push({
          qid: QUIZ.questions[QUIZ.idx].id,
          chosen: v,
          correctAnswer: correct,
          correct_: isCorrect,
          question: QUIZ.questions[QUIZ.idx],
        });
        document.getElementById("nextQuizBtn").style.display = "inline-flex";
        updateSkillMastery(QUIZ.questions[QUIZ.idx], isCorrect);
      }

      function showQuizFeedback(isCorrect, expl, card, correct, chosen) {
        const fb = card.querySelector(".feedback");
        if (isCorrect) {
          fb.className = "feedback correct show";
          fb.innerHTML =
            "<h4>✓ إجابة صحيحة!</h4><p><b>لماذا؟</b> " + expl + "</p>";
        } else {
          fb.className = "feedback wrong show";
          fb.innerHTML =
            "<h4>✗ ليست الإجابة الصحيحة</h4><p><b>الإجابة الصحيحة:</b> " +
            fmtAnswer(correct || "") +
            "</p><p><b>لماذا؟</b> " +
            expl +
            "</p>";
        }
      }

      function nextQuizQuestion() {
        QUIZ.idx++;
        renderQuizQuestion();
      }

      function finishQuiz() {
        const total = QUIZ.questions.length;
        const pct = Math.round((QUIZ.score / total) * 100);
        const result = {
          score: QUIZ.score,
          total,
          answered: QUIZ.answered,
          results: QUIZ.results,
          date: Date.now(),
          lessonId: QUIZ.lessonId,
        };
        state.quizResults[`lesson_${QUIZ.lessonId}_${Date.now()}`] = result;
        // Keep best
        const key = `lesson_${QUIZ.lessonId}_best`;
        const prev = state.quizResults[key];
        if (!prev || pct > (prev.score / prev.total) * 100)
          state.quizResults[key] = result;
        // Badges
        if (pct === 100 && !state.badges.includes("perfect_score"))
          state.badges.push("perfect_score");
        if (
          QUIZ.lessonId === 1 &&
          pct >= 80 &&
          !state.badges.includes("power_master")
        )
          state.badges.push("power_master");
        if (
          QUIZ.lessonId === 2 &&
          pct >= 80 &&
          !state.badges.includes("eq_solver")
        )
          state.badges.push("eq_solver");
        state.stars += Math.floor(pct / 20);
        pruneHistory();
        saveState();
        showResults(
          pct,
          QUIZ.score,
          total,
          QUIZ.results,
          "Quiz - الدرس " + QUIZ.lessonId,
        );
        if (pct >= 80) {
          confetti();
        }
      }

      function exitQuiz() {
        CURRENT.sectionIdx = 6;
        navigate("lesson");
        renderLessonSection();
      }

      /* ============================ EXAM ENGINE ============================ */
      let EXAM = {
        questions: [],
        idx: 0,
        score: 0,
        answered: 0,
        results: [],
        lessonId: 1,
        timeLeft: 600,
        timerId: null,
        startedAt: Date.now(),
        answers: {},
      };

      function startExam(lessonId) {
        CURRENT.lessonId = lessonId;
        const bank = lessonId === 1 ? L1_QUESTIONS : L2_QUESTIONS;
        EXAM = {
          questions: buildTest(bank, [3, 3, 2]),
          idx: 0,
          score: 0,
          answered: 0,
          results: [],
          lessonId,
          timeLeft: 600,
          timerId: null,
          startedAt: Date.now(),
          answers: {},
        };
        state.activeExam = {
          lessonId,
          idx: 0,
          answers: {},
          startedAt: Date.now(),
          timeLeft: 600,
          questions: EXAM.questions,
        };
        saveState();
        navigate("exam");
        document.body.classList.add("exam-mode");
        renderExamQuestion();
        startExamTimer();
      }

      function startExamTimer() {
        if (EXAM.timerId) clearInterval(EXAM.timerId);
        EXAM.timerId = setInterval(() => {
          EXAM.timeLeft--;
          updateTimerDisplay();
          if (state.activeExam) state.activeExam.timeLeft = EXAM.timeLeft;
          if (EXAM.timeLeft <= 0) {
            submitExam(true);
          }
          if (EXAM.timeLeft <= 60) {
            const t = $("#examTimer");
            if (t) t.classList.add("danger");
            else
              setTimeout(() => {
                const t2 = $("#examTimer");
                if (t2) t2.classList.add("danger");
              }, 10);
          }
          if (EXAM.timeLeft <= 180) {
            const t = $("#examTimer");
            if (t && !t.classList.contains("danger"))
              t.classList.add("warning");
          }
        }, 1000);
      }

      function updateTimerDisplay() {
        const t = $("#examTimer");
        if (t) t.textContent = fmtTime(EXAM.timeLeft);
      }

      function renderExamQuestion() {
        const q = EXAM.questions[EXAM.idx];
        if (!q) {
          submitExam(false);
          return;
        }
        $("#topbarTitle").textContent = `امتحان - الدرس ${EXAM.lessonId}`;
        const pct = (EXAM.idx / EXAM.questions.length) * 100;
        const progress = EXAM.idx + 1;

let optsHtml = "";
        if (q.type === "mcq" || q.type === "error") {
          optsHtml = `<div class="q-options">${shuffle([...q.options])
            .map(
              (opt, j) => `
      <div class="q-option ${EXAM.answers[q.id] === opt ? "selected" : ""}" onclick="selectExamAnswer(this,'${opt.replace(/'/g, "\\'")}',${q.id})">
        <div class="q-letter">${"أبتثد"[j]}</div><div class="q-text">${opt}</div>
      </div>`,
            )
            .join("")}</div>`;
        } else if (q.type === "tf") {
          optsHtml = `<div class="q-options">${q.options
            .map(
              (opt, j) => `
      <div class="q-option ${EXAM.answers[q.id] === opt ? "selected" : ""}" onclick="selectExamAnswer(this,'${opt.replace(/'/g, "\\'")}',${q.id})">
        <div class="q-letter">${j === 0 ? "✓" : "✗"}</div><div class="q-text">${opt}</div>
      </div>`,
            )
            .join("")}</div>`;
        } else {
          optsHtml = `<div style="display:flex;gap:8px;align-items:center">
      <input type="text" id="examAns" value="${EXAM.answers[q.id] || ""}" placeholder="اكتب الإجابة" style="flex:1;padding:12px;border:2px solid var(--border);border-radius:8px;font-size:16px;text-align:center" oninput="EXAM.answers[${q.id}]=this.value;state.activeExam.answers[${q.id}]=this.value;saveState()">
    </div>`;
        }

        $("#page-exam").innerHTML = `
    <div class="quiz-progress">
      <div class="quiz-info">

      </div>
      <div class="exam-timer" id="examTimer">${fmtTime(EXAM.timeLeft)}</div>
    </div>
    <div class="progress" style="margin-bottom:14px"><div class="progress-bar" style="width:${pct}%"></div></div>

    <div class="q-card">
      <div class="q-header">
        <span class="q-badge">${q.skill}</span>
        <span class="q-badge">${progress} / ${EXAM.questions.length}</span>
      </div>
      <p class="q-prompt">${renderMathPrompt(q.prompt)}</p>
      ${optsHtml}
    </div>

    <div class="card" style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap;gap:8px">
