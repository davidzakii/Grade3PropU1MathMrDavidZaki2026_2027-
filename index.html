      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">
        ${EXAM.questions.map((_, i) => `<button class="btn btn-sm ${i === EXAM.idx ? "btn-primary" : EXAM.answers[EXAM.questions[i].id] ? "btn-success" : "btn-ghost"}" onclick="goToExamQ(${i})">${i + 1}</button>`).join("")}
      </div>
      ${
        EXAM.idx < EXAM.questions.length - 1
          ? `<button class="btn btn-primary" onclick="nextExamQuestion()">التالي ←</button>`
          : `<button class="btn btn-success" onclick="submitExam(false)">إنهاء الامتحان ✓</button>`
      }
    </div>
  `;
      }

      function selectExamAnswer(el, chosen, qid) {
        EXAM.answers[qid] = chosen;
        if (state.activeExam) {
          state.activeExam.answers[qid] = chosen;
          saveState();
        }
        const card = el.closest(".q-card");
        const opts = card.querySelectorAll(".q-option");
        opts.forEach((o) => o.classList.remove("selected"));
        el.classList.add("selected");
        // Update nav dots
        const navBtns = document.querySelectorAll("#page-exam .card .btn-sm");
        navBtns.forEach((b, i) => {
          if (EXAM.answers[EXAM.questions[i].id])
            (b.classList.add("btn-success"), b.classList.remove("btn-ghost"));
        });
      }

      function saveExamPosition() {
        if (state.activeExam) {
          state.activeExam.idx = EXAM.idx;
          state.activeExam.timeLeft = EXAM.timeLeft;
          saveState();
        }
      }
      function nextExamQuestion() {
        if (EXAM.idx < EXAM.questions.length - 1) {
          EXAM.idx++;
          saveExamPosition();
          renderExamQuestion();
        }
      }
      function prevExamQuestion() {
        if (EXAM.idx > 0) {
          EXAM.idx--;
          saveExamPosition();
          renderExamQuestion();
        }
      }
      function goToExamQ(i) {
        EXAM.idx = i;
        saveExamPosition();
        renderExamQuestion();
      }

      function submitExam(timeUp) {
        if (EXAM.timerId) clearInterval(EXAM.timerId);
        let score = 0;
        const results = [];
        EXAM.questions.forEach((q, i) => {
          const ans = EXAM.answers[q.id];
          const isCorrect =
            ans !== undefined && answersEquivalent(ans, q.correctAnswer);
          if (isCorrect) score++;
          else if (ans !== undefined && ans !== "") recordMistake(q);
          results.push({
            qid: q.id,
            chosen: ans,
            correct: q.correctAnswer,
            correct_: isCorrect,
            question: q,
          });
          updateSkillMastery(q, isCorrect);
        });
        const total = EXAM.questions.length;
        const pct = Math.round((score / total) * 100);
        const result = {
          score,
          total,
          results,
          date: Date.now(),
          lessonId: EXAM.lessonId,
          timeUsed: 600 - EXAM.timeLeft,
          timeUp: !!timeUp,
        };
        state.examResults[`exam_${EXAM.lessonId}_${Date.now()}`] = result;
        const key = `exam_${EXAM.lessonId}_best`;
        const prev = state.examResults[key];
        if (!prev || pct > (prev.score / prev.total) * 100)
          state.examResults[key] = result;
        if (pct >= 60 && !state.badges.includes("exam_pass"))
          state.badges.push("exam_pass");
        state.stars += Math.floor(pct / 15);
        state.activeExam = null;
        pruneHistory();
        saveState();
        document.body.classList.remove("exam-mode");
        showResults(
          pct,
          score,
          total,
          results,
          "امتحان - الدرس " + EXAM.lessonId,
          timeUp,
        );
        if (pct >= 80) confetti();
      }

    </div>
  `;
      }

        state.mistakes.push({
          qid: q.id,
          lessonId: q.lessonId,
          topicId: q.topicId,
          skill: q.skill,
          type: q.type,
          difficulty: q.difficulty,
          prompt: q.prompt,
          correctAnswer: q.correctAnswer,
          explanation: q.explanation,
          date: Date.now(),
        });
        if (state.mistakes.length > 200)
          state.mistakes = state.mistakes.slice(-200);
        saveState();
      }

      function updateSkillMastery(q, isCorrect) {
        const k = `${q.lessonId}_${q.skill}`;
        if (!state.skillMastery[k])
          state.skillMastery[k] = {
            correct: 0,
            total: 0,
            skill: q.skill,
            lessonId: q.lessonId,
          };
        state.skillMastery[k].total++;
        if (isCorrect) state.skillMastery[k].correct++;
        saveState();
      }

      <p style="font-size:14px;margin-bottom:8px">${renderMathPrompt(m.prompt)}</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;font-size:13px">

            <div class="badge-name">${b.name}</div>
            <div style="font-size:10px;color:var(--text-mute);margin-top:4px">${b.desc}</div>
            ${is ? '<div style="color:var(--success);font-size:10px;margin-top:4px;font-weight:700">✓ مفتوحة</div>' : '<div style="color:var(--text-mute);font-size:10px;margin-top:4px">🔒 مغلقة</div>'}
          </div>`;
        }).join("")}
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <h3 style="margin-bottom:10px">⭐ نجومك</h3>
      <div class="grid grid-3">
        <div class="stat-card warning">
          <div class="stat-icon">⭐</div>
          <div class="stat-value">${state.stars}</div>
          <div class="stat-label">إجمالي النجوم</div>
        </div>
        <div class="stat-card primary">
          <div class="stat-icon">📚</div>
          <div class="stat-value">${state.completedLessons.length}</div>
          <div class="stat-label">دروس مكتملة</div>
        </div>
        <div class="stat-card success">
          <div class="stat-icon">🏆</div>
          <div class="stat-value">${state.badges.length}</div>
          <div class="stat-label">شارات</div>
        </div>
      </div>
    </div>
  `;
      }

      /* ============================ PROGRESS PAGE ============================ */
      function renderProgress() {
        const stats = computeStats();
        const skills = Object.entries(state.skillMastery)
          .map(([k, v]) => {
            const pct = v.total ? Math.round((v.correct / v.total) * 100) : 0;
            const lesson = CURRICULUM.lessons.find((l) => l.id == v.lessonId);
            return { key: k, ...v, pct };
          })
          .sort((a, b) => a.pct - b.pct);

        $("#page-progress").innerHTML = `
    <div class="hero">
      <div class="hero-inner">
        <h2>📈 تقدّمك في الوحدة</h2>
        <p>${stats.progressPct}% من الوحدة مكتمل. أنت في طريقك لتصبح بطل الرياضيات!</p>
        <div class="progress" style="margin-top:10px;max-width:500px;height:14px"><div class="progress-bar" style="width:${stats.progressPct}%"></div></div>
      </div>
    </div>

    <div class="grid grid-4" style="margin-bottom:18px">
      <div class="stat-card primary">
        <div class="stat-icon">📊</div>
        <div class="stat-value">${stats.progressPct}%</div>
        <div class="stat-label">نسبة الإنجاز</div>
      </div>
      <div class="stat-card success">
        <div class="stat-icon">📚</div>
        <div class="stat-value">${stats.completedLessons}/${stats.totalLessons}</div>
        <div class="stat-label">دروس مكتملة</div>
      </div>
      <div class="stat-card warning">
        <div class="stat-icon">📝</div>
        <div class="stat-value">${stats.totalQAnswered}</div>
        <div class="stat-label">أسئلة محلولة</div>
      </div>
      <div class="stat-card danger">
        <div class="stat-icon">🎯</div>
        <div class="stat-value">${Math.round(stats.avgScore)}%</div>
        <div class="stat-label">متوسط الدرجات</div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:14px">📚 تقدم الدروس</h3>
      ${CURRICULUM.lessons
        .map((l) => {
          const completed = state.completedLessons.includes(l.id);
          const sections = (state.completedSections[l.id] || []).length;
          const total = l.sections.length;
          const pct = Math.round((sections / total) * 100);
          return `<div style="margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span style="font-weight:700">${completed ? "✓ " : ""}الدرس ${l.id}: ${l.title}</span>
            <span style="color:var(--text-mute);font-size:13px">${sections}/${total} قسم • ${completed ? '<span style="color:var(--success)">مكتمل</span>' : "جاري التقدم"}</span>
          </div>
          <div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>
        </div>`;
        })
        .join("")}
    </div>

    <div class="card" style="margin-top:14px">
      <h3 style="margin-bottom:14px">🎯 إتقان المهارات</h3>
      ${skills.length === 0 ? '<p style="color:var(--text-mute);text-align:center">ابدأ بحل الأسئلة لرؤية إتقان مهاراتك هنا.</p>' : ""}
      ${skills
        .map((s) => {
          const mastery =
            s.pct >= 90
              ? "متميز"
              : s.pct >= 80
                ? "متقن"
                : s.pct >= 60
                  ? "جيد"
                  : s.pct >= 40
                    ? "في طور التعلم"
                    : "يحتاج تدريب";
          const color =
            s.pct >= 80
              ? "var(--success)"
              : s.pct >= 60
                ? "var(--primary)"
                : s.pct >= 40
                  ? "var(--warning)"
                  : "var(--danger)";
          return `<div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <span><b>${s.skill}</b> <span style="color:var(--text-mute);font-size:12px">(درس ${s.lessonId})</span></span>
            <span style="color:${color};font-weight:700;font-size:13px">${s.pct}% • ${mastery}</span>
          </div>
          <div class="progress progress-thin"><div class="progress-bar" style="width:${s.pct}%;background:${color}"></div></div>
          <div style="font-size:11px;color:var(--text-mute);margin-top:2px">${s.correct}/${s.total} إجابات صحيحة</div>
          ${s.pct < 60 ? '<div style="margin-top:6px"><button class="btn btn-sm btn-warning" onclick="openLesson(' + s.lessonId + ')">📚 مراجعة + تدريب</button></div>' : ""}
        </div>`;
        })
        .join("")}
    </div>
  `;
      }

      /* ============================ SETTINGS ============================ */
      function renderSettings() {
        $("#page-settings").innerHTML = `
    <div class="card card-lg">
      <h2 style="margin-bottom:14px">⚙️ الإعدادات</h2>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:14px;background:var(--bg-soft);border-radius:10px">
          <div>
            <h4>🌓 المظهر</h4>
            <p style="color:var(--text-mute);font-size:13px">الوضع الفاتح أو الداكن</p>
          </div>
          <button class="btn ${state.theme === "dark" ? "btn-primary" : "btn-ghost"}" onclick="setTheme('${state.theme === "dark" ? "light" : "dark"}')">${state.theme === "dark" ? "☀️ فاتح" : "🌙 داكن"}</button>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:14px;background:var(--bg-soft);border-radius:10px">
          <div>
            <h4>🔊 الصوت</h4>
            <p style="color:var(--text-mute);font-size:13px">تشغيل التعليق الصوتي</p>
          </div>
          <button class="btn ${state.sound ? "btn-primary" : "btn-ghost"}" onclick="toggleSound()">${state.sound ? "مفعّل" : "معطّل"}</button>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:14px;background:var(--bg-soft);border-radius:10px">
          <div>
            <h4>🎚️ مستوى الأسئلة</h4>
            <p style="color:var(--text-mute);font-size:13px">يؤثر على اختبارات الدروس والتحدي اليومي</p>
          </div>
          <select id="diffPref" onchange="setDiffPref(this.value)" aria-label="مستوى الأسئلة" style="padding:8px;border:2px solid var(--border);border-radius:8px;background:var(--bg-card);color:var(--text);font-size:14px">
            <option value="all" ${state.difficultyPref === "all" ? "selected" : ""}>متنوع (سهل، متوسط، صعب)</option>
            <option value="easy" ${state.difficultyPref === "easy" ? "selected" : ""}>أسئلة سهلة</option>
            <option value="medium" ${state.difficultyPref === "medium" ? "selected" : ""}>أسئلة متوسطة</option>
            <option value="hard" ${state.difficultyPref === "hard" ? "selected" : ""}>أسئلة صعبة</option>
          </select>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:14px;background:var(--bg-soft);border-radius:10px">
          <div>
            <h4>👤 اسم الطالب</h4>
            <input type="text" id="studentName" value="${state.student.name}" style="padding:8px;border:2px solid var(--border);border-radius:6px;margin-top:6px">
          </div>
          <button class="btn btn-success" onclick="saveStudentName()">حفظ</button>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:14px;background:var(--danger-soft);border-radius:10px;border:1px solid var(--danger)">
          <div>
            <h4 style="color:var(--danger)">⚠️ إعادة ضبط التقدم</h4>
            <p style="color:var(--text-mute);font-size:13px">سيتم حذف جميع بياناتك</p>
          </div>
          <button class="btn btn-danger" onclick="resetAll()">إعادة الضبط</button>
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:14px;text-align:center">
      <p style="color:var(--text-mute);font-size:13px">الوحدة الأولى - الأعداد النسبية والقوى والمعادلات الأسية</p>
      <p style="color:var(--text-mute);font-size:13px">إعداد: أستاذ ديفيد زكي • الصف الثالث الإعدادي • ${new Date().getFullYear()}/${new Date().getFullYear() + 1}</p>
    </div>
  `;
      }

      function setTheme(theme) {
        state.theme = theme;
        document.documentElement.setAttribute("data-theme", theme);
        saveState();
        renderSettings();
      }
      function saveStudentName() {
        state.student.name = $("#studentName").value.trim() || "بطل";
        saveState();
        updateStudentGreeting();
        renderDashboard();
        toast("✓ تم الحفظ", "success");
      }
      function setDiffPref(v) {
        state.difficultyPref = v;
        saveState();
        toast("✓ تم حفظ مستوى الأسئلة", "success");
      }
      function resetAll() {
        if (confirm("هل أنت متأكد من حذف كل التقدم؟")) {
          localStorage.removeItem("dz_math_unit1");
          location.reload();
        }
      }

      /* ============================ COMPLETION ============================ */
      function renderCompletion() {
        const stats = computeStats();
        $("#page-completion").innerHTML = `
    <div class="hero" style="background:linear-gradient(135deg,#16a34a,#22d3ee)">
      <div class="hero-inner">
        <h2>🎉 مبروك يا بطل!</h2>
        <p>لقد أتممت الوحدة الأولى كاملة.</p>
        <div class="teacher">⭐ مع مدرسك: ${CURRICULUM.teacher} ⭐</div>
      </div>
    </div>

    <div class="card card-lg complete-screen">
      <div class="trophy bounce">🏆</div>
      <h2>أتممت الوحدة الأولى!</h2>
      <p>أنت الآن متمكن من القوى والمعادلات الأسية.</p>
      <div class="grid grid-3" style="margin-top:18px">
        <div class="stat-card primary">
          <div class="stat-icon">📊</div>
          <div class="stat-value">${stats.progressPct}%</div>
          <div class="stat-label">نسبة الإنجاز</div>
        </div>
        <div class="stat-card warning">
          <div class="stat-icon">⭐</div>
          <div class="stat-value">${state.stars}</div>
          <div class="stat-label">النجوم</div>
        </div>
        <div class="stat-card success">
          <div class="stat-icon">🏆</div>
          <div class="stat-value">${state.badges.length}</div>
          <div class="stat-label">الشارات</div>
        </div>
      </div>
      <div style="margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="navigate('dashboard')">🏠 الرئيسية</button>
        <button class="btn btn-outline" onclick="navigate('achievements')">🏆 إنجازاتي</button>
      </div>
    </div>
  `;
        confetti();
        setTimeout(confetti, 800);
        setTimeout(confetti, 1600);
      }

      /* ============================ EXAM RESUME ============================ */
      function checkResumeExam() {
        if (state.activeExam) {
          openModal(`
      <h3>📝 لديك امتحان غير مكتمل</h3>
      <p>لديك امتحان بدأته في ${new Date(state.activeExam.startedAt).toLocaleString("ar-EG")} ولم تكمله.</p>
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="resumeExam()">▶ متابعة</button>
        <button class="btn btn-danger" onclick="discardExam()">بدء امتحان جديد</button>
      </div>
    `);
          return true;
        }
        return false;
      }

      function resumeExam() {
        closeModal();
        EXAM = {
          questions: state.activeExam.questions,
          idx: state.activeExam.idx || 0,
          score: 0,
          answered: 0,
          results: [],
          lessonId: state.activeExam.lessonId,
          timeLeft: state.activeExam.timeLeft || 600,
          timerId: null,
          startedAt: state.activeExam.startedAt,
          answers: state.activeExam.answers || {},
        };
        navigate("exam");
        document.body.classList.add("exam-mode");
        renderExamQuestion();
        startExamTimer();
      }

      function discardExam() {
        closeModal();
        state.activeExam = null;
        saveState();
        startExam(1);
      }

      /* ============================ INIT ============================ */
      function init() {
        // Apply theme
        document.documentElement.setAttribute("data-theme", state.theme);
        updateStudentGreeting();
        if (!state.sound) $("#soundBtn").textContent = "🔇";
        renderSidebarLessons();
        renderDashboard();
        renderUnit();
        renderMistakes();
        renderAchievements();
        renderProgress();
        renderSettings();
        renderCompletion();
        renderChallenge();
        // Default page
        navigate("dashboard");
        setTimeout(() => {
          checkResumeExam();
        }, 600);
      }
      window.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
